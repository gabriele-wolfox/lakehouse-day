# Points CNPG's barman-cloud plugin at the SAME RustFS bucket used by the
# Iceberg warehouse (see scripts/01-generate-iceberg-table.py), just a
# different prefix. Pattern 1 of the talk: one storage layer, one policy set.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: rustfs-objectstore
spec:
  configuration:
    destinationPath: s3://lakehouse/cnpg-backups/
    endpointURL: http://rustfs:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
